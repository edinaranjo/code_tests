
name: Code Audit

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read


jobs:

  # ==========================================================
  # 1. CODE QUALITY - RUFF
  #
  # Este job se ejecuta primero y funciona como Quality Gate.
  # Si Ruff falla, los demás jobs no se ejecutan.
  # ==========================================================

  ruff:

    name: CQ-01 | Ruff Code Quality

    runs-on: ubuntu-latest

    steps:

      # Descarga el código del repositorio en el runner.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Configura Python 3.12.
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Actualiza pip.
      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      # Instala Ruff.
      - name: Install Ruff
        run: |
          python -m pip install ruff

      # Analiza calidad y reglas de linting.
      # Si encuentra incumplimientos, el job falla.
      - name: Run Ruff lint analysis
        run: |
          ruff check \
            --output-format=github \
            main.py tests

      # Verifica el formato del código sin modificar archivos.
      - name: Run Ruff format validation
        run: |
          ruff format \
            --check \
            main.py tests


  # ==========================================================
  # 2. TESTING Y COVERAGE
  #
  # Se ejecuta únicamente si Ruff pasa.
  # Genera coverage.xml y reporte HTML.
  # ==========================================================

  tests-coverage:

    name: TC-01 | Tests and Coverage

    runs-on: ubuntu-latest

    needs: ruff

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      # Dependencias funcionales de la aplicación.
      - name: Install application dependencies
        run: |
          python -m pip install -r requirements.txt

      # Dependencias necesarias para pruebas y cobertura.
      - name: Install testing tools
        run: |
          python -m pip install pytest pytest-cov coverage

      # Crea el directorio temporal de reportes dentro del runner.
      - name: Create reports directory
        run: |
          mkdir -p reports

      # Ejecuta las pruebas y genera evidencia de cobertura.
      - name: Run tests with coverage
        run: |
          python -m pytest \
            --cov=main \
            --cov-report=term-missing \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=html:reports/htmlcov

      # Verifica que los archivos realmente fueron generados.
      - name: Verify coverage reports
        run: |
          echo "Coverage reports generated:"
          find reports -maxdepth 3 -type f | sort

          test -f reports/coverage.xml
          test -f reports/htmlcov/index.html

      # Guarda temporalmente los reportes para el job final.
      - name: Upload coverage intermediate artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-evidence
          path: |
            reports/coverage.xml
            reports/htmlcov/
          if-no-files-found: error
          retention-days: 1


  # ==========================================================
  # 3. SAST - BANDIT
  #
  # Analiza el código Python buscando patrones potencialmente
  # inseguros.
  #
  # Primera ejecución:
  #   genera evidencia JSON.
  #
  # Segunda ejecución:
  #   actúa como Security Gate.
  # ==========================================================

  bandit:

    name: SA-01 | Bandit SAST

    runs-on: ubuntu-latest

    needs: ruff

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install Bandit
        run: |
          python -m pip install bandit

      - name: Create reports directory
        run: |
          mkdir -p reports

      # Genera el reporte JSON.
      # "|| true" permite conservar evidencia incluso si existen
      # vulnerabilidades.
      - name: Generate Bandit JSON report
        run: |
          bandit \
            main.py \
            -f json \
            -o reports/bandit-report.json \
            || true

      - name: Verify Bandit report
        run: |
          echo "Bandit report generated:"
          ls -lh reports/bandit-report.json

      # Guarda temporalmente el reporte para consolidarlo después.
      - name: Upload Bandit intermediate artifact
        uses: actions/upload-artifact@v4
        with:
          name: bandit-evidence
          path: reports/bandit-report.json
          if-no-files-found: error
          retention-days: 1

      # Security Gate.
      # -ll considera hallazgos Medium y High.
      - name: Enforce Bandit security gate
        run: |
          bandit main.py -ll


  # ==========================================================
  # 4. SOFTWARE COMPOSITION ANALYSIS - PIP-AUDIT
  #
  # Analiza vulnerabilidades conocidas en las dependencias
  # declaradas en requirements.txt.
  # ==========================================================

  dependency-audit:

    name: SC-01 | Dependency Audit

    runs-on: ubuntu-latest

    needs: ruff

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install pip-audit
        run: |
          python -m pip install pip-audit

      - name: Create reports directory
        run: |
          mkdir -p reports

      # Primera ejecución:
      # genera el reporte sin detener el job.
      - name: Generate dependency audit report
        run: |
          pip-audit \
            -r requirements.txt \
            -f json \
            -o reports/pip-audit-report.json \
            || true

      - name: Verify dependency audit report
        run: |
          echo "Dependency audit report generated:"
          ls -lh reports/pip-audit-report.json

      # Guarda temporalmente el reporte.
      - name: Upload dependency intermediate artifact
        uses: actions/upload-artifact@v4
        with:
          name: dependency-evidence
          path: reports/pip-audit-report.json
          if-no-files-found: error
          retention-days: 1

      # Security Gate:
      # si existe una vulnerabilidad conocida, el job falla.
      - name: Enforce dependency security gate
        run: |
          pip-audit \
            -r requirements.txt


  # ==========================================================
  # 5. CONSOLIDACIÓN DE EVIDENCIAS
  #
  # Este job reúne todos los reportes generados por los jobs
  # anteriores y crea UN único artifact:
  #
  #     audit-reports
  #
  # Cada job usa un runner independiente, por eso primero
  # debemos descargar los artifacts intermedios.
  # ==========================================================

  audit-evidence:

    name: AU-01 | Consolidate Audit Evidence

    runs-on: ubuntu-latest

    needs:
      - tests-coverage
      - bandit
      - dependency-audit

    # Se ejecuta incluso si alguno de los controles anteriores
    # terminó en error, siempre que los jobs hayan sido iniciados.
    if: always()

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # Crea la estructura donde se consolidará la evidencia.
      - name: Create reports structure
        run: |
          mkdir -p reports/coverage
          mkdir -p reports/security
          mkdir -p reports/dependencies

      # Descarga la evidencia de Coverage.
      - name: Download coverage evidence
        uses: actions/download-artifact@v4
        with:
          name: coverage-evidence
          path: reports/coverage

      # Descarga la evidencia de Bandit.
      - name: Download Bandit evidence
        uses: actions/download-artifact@v4
        with:
          name: bandit-evidence
          path: reports/security

      # Descarga la evidencia de pip-audit.
      - name: Download dependency evidence
        uses: actions/download-artifact@v4
        with:
          name: dependency-evidence
          path: reports/dependencies

      # Muestra qué archivos se consolidaron.
      - name: Verify consolidated reports
        run: |
          echo "========================================"
          echo "AUDIT EVIDENCE"
          echo "========================================"

          find reports -type f | sort

      # Crea un único artifact con todas las evidencias.
      - name: Upload consolidated audit reports
        uses: actions/upload-artifact@v4
        with:
          name: audit-reports
          path: reports/
          if-no-files-found: error
          retention-days: 30
