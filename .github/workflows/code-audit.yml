name: Code Audit

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read


jobs:

  # ==========================================================
  # 1. CODE QUALITY - RUFF
  # ==========================================================

  ruff:

    name: CQ-01 | Ruff Code Quality

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install Ruff
        run: |
          python -m pip install ruff

      - name: Run Ruff lint analysis
        run: |
          ruff check \
            --output-format=github \
            main.py tests

      - name: Run Ruff format validation
        run: |
          ruff format \
            --check \
            main.py tests


  # ==========================================================
  # 2. FUNCTIONAL TESTS AND COVERAGE
  #
  # This job runs only if Ruff passes.
  # ==========================================================

  tests-coverage:

    name: TC-01 | Tests and Coverage

    runs-on: ubuntu-latest

    needs: ruff

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install application dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Install testing dependencies
        run: |
          python -m pip install pytest pytest-cov coverage

      - name: Create reports directory
        run: |
          mkdir -p reports

      - name: Run tests with coverage
        run: |
          python -m pytest \
            --cov=main \
            --cov-report=term-missing \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=html:reports/htmlcov

      - name: Verify coverage files
        run: |
          echo "========================================"
          echo "Coverage artifacts generated"
          echo "========================================"

          find reports -maxdepth 3 -type f | sort

          echo "========================================"
          echo "Coverage XML"
          echo "========================================"

          test -f reports/coverage.xml

          echo "coverage.xml generated successfully"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            reports/coverage.xml
            reports/htmlcov/
          if-no-files-found: error
          retention-days: 30


  # ==========================================================
  # 3. STATIC APPLICATION SECURITY TESTING - BANDIT
  #
  # Runs after Ruff. It may run in parallel with pytest
  # and pip-audit.
  # ==========================================================

  bandit:

    name: SA-01 | Bandit SAST

    runs-on: ubuntu-latest

    needs: ruff

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install Bandit
        run: |
          python -m pip install bandit

      - name: Create reports directory
        run: |
          mkdir -p reports

      # ------------------------------------------------------
      # Generate evidence.
      #
      # "|| true" is intentional here.
      # Even if Bandit finds a vulnerability, we still want
      # the JSON report to be preserved as audit evidence.
      # ------------------------------------------------------

      - name: Generate Bandit JSON report
        run: |
          bandit \
            main.py \
            -f json \
            -o reports/bandit-report.json \
            || true

      - name: Verify Bandit report
        run: |
          echo "========================================"
          echo "Bandit audit evidence"
          echo "========================================"

          ls -lh reports/bandit-report.json

          echo "========================================"
          echo "Bandit JSON content"
          echo "========================================"

          cat reports/bandit-report.json

      - name: Upload Bandit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: reports/bandit-report.json
          if-no-files-found: error
          retention-days: 30

      # ------------------------------------------------------
      # Security Gate
      #
      # -ll means Medium and High severity findings are used
      # to determine failure.
      # ------------------------------------------------------

      - name: Enforce Bandit security gate
        run: |
          bandit main.py -ll


  # ==========================================================
  # 4. SOFTWARE COMPOSITION ANALYSIS - PIP-AUDIT
  # ==========================================================

  dependency-audit:

    name: SC-01 | Dependency Audit

    runs-on: ubuntu-latest

    needs: ruff

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install pip-audit
        run: |
          python -m pip install pip-audit

      - name: Create reports directory
        run: |
          mkdir -p reports

      # ------------------------------------------------------
      # Generate audit evidence first.
      # ------------------------------------------------------

      - name: Generate dependency audit report
        run: |
          pip-audit \
            -r requirements.txt \
            -f json \
            -o reports/pip-audit-report.json \
            || true

      - name: Verify dependency audit report
        run: |
          echo "========================================"
          echo "Dependency audit evidence"
          echo "========================================"

          ls -lh reports/pip-audit-report.json

          echo "========================================"
          echo "pip-audit JSON content"
          echo "========================================"

          cat reports/pip-audit-report.json

      - name: Upload dependency audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-report
          path: reports/pip-audit-report.json
          if-no-files-found: error
          retention-days: 30

      # ------------------------------------------------------
      # Security Gate
      #
      # If a known vulnerable dependency exists, the job fails.
      # ------------------------------------------------------

      - name: Enforce dependency security gate
        run: |
          pip-audit \
            -r requirements.txt
