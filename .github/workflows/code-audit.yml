name: Code Audit

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read


jobs:

  code-quality:

    name: CQ-01 | Ruff

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install audit tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-audit.txt

      - name: Ruff lint analysis
        run: |
          ruff check \
            --output-format=github \
            main.py tests

      - name: Ruff format validation
        run: |
          ruff format \
            --check \
            main.py tests


  tests-coverage:

    name: TC-01 | Tests and Coverage

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-audit.txt

      - name: Create reports directory
        run: |
          mkdir -p reports

      - name: Execute tests with coverage
        run: |
          python -m pytest \
            --cov=main \
            --cov-report=term-missing \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=html:reports/htmlcov

      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: reports/


  sast-bandit:

    name: SA-01 | Bandit SAST

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install audit tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-audit.txt

      - name: Create reports directory
        run: |
          mkdir -p reports

      - name: Generate Bandit audit report
        run: |
          bandit \
            main.py \
            -f json \
            -o reports/bandit-report.json \
            || true

      - name: Upload Bandit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: reports/bandit-report.json

      - name: Enforce Bandit security gate
        run: |
          bandit \
            main.py \
            -ll


  dependency-audit:

    name: SC-01 | Dependency Audit

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install audit tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-audit.txt

      - name: Create reports directory
        run: |
          mkdir -p reports

      - name: Generate dependency audit evidence
        run: |
          pip-audit \
            -r requirements.txt \
            -f json \
            -o reports/pip-audit-report.json \
            || true

      - name: Upload dependency audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-report
          path: reports/pip-audit-report.json

      - name: Enforce dependency security gate
        run: |
          pip-audit \
            -r requirements.txt
