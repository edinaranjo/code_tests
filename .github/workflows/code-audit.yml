name: Code Audit

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read


jobs:

  # ==========================================================
  # 1. CODE QUALITY - RUFF
  #
  # Primer Quality Gate del pipeline.
  # Si Ruff falla, los demás controles no se ejecutan.
  # ==========================================================

  ruff:

    name: CQ-01 | Ruff Code Quality

    runs-on: ubuntu-latest

    steps:

      # Descarga el repositorio dentro del runner.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Configura Python 3.12.
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Actualiza pip.
      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      # Instala Ruff.
      - name: Install Ruff
        run: |
          python -m pip install ruff

      # Analiza calidad y reglas de linting.
      # Si encuentra incumplimientos, el job falla.
      - name: Run Ruff lint analysis
        run: |
          ruff check \
            --output-format=github \
            main.py tests

      # Verifica formato sin modificar los archivos.
      - name: Run Ruff format validation
        run: |
          ruff format \
            --check \
            main.py tests

      # Publica un resumen visible directamente en GitHub.
      - name: Publish Ruff summary
        if: success()
        run: |
          echo "## 🧹 CQ-01 | Ruff Code Quality" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ **PASS** — No se detectaron incumplimientos de linting o formato." \
            >> "$GITHUB_STEP_SUMMARY"


  # ==========================================================
  # 2. TESTING + COVERAGE
  #
  # Se ejecuta solo si Ruff finaliza correctamente.
  # ==========================================================

  tests-coverage:

    name: TC-01 | Tests and Coverage

    runs-on: ubuntu-latest

    needs: ruff

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      # Instala las dependencias funcionales.
      - name: Install application dependencies
        run: |
          python -m pip install -r requirements.txt

      # Instala herramientas de testing y coverage.
      - name: Install testing tools
        run: |
          python -m pip install pytest pytest-cov coverage

      # Crea el directorio donde se almacenará la evidencia.
      - name: Create reports directory
        run: |
          mkdir -p reports

      # Ejecuta pruebas y genera:
      # - salida de cobertura en terminal;
      # - coverage.xml;
      # - reporte HTML.
      - name: Run tests with coverage
        run: |
          python -m pytest \
            --cov=main \
            --cov-report=term-missing \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=html:reports/htmlcov

      # Verifica que los reportes se hayan generado.
      - name: Verify coverage reports
        run: |
          echo "Generated coverage reports:"
          find reports -maxdepth 3 -type f | sort

          test -f reports/coverage.xml
          test -f reports/htmlcov/index.html

      # Publica el resultado visible directamente en GitHub.
      - name: Publish coverage summary
        if: always()
        run: |
          echo "## 📊 TC-01 | Tests and Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Guarda temporalmente el reporte para consolidarlo al final.
      - name: Upload coverage intermediate artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-evidence
          path: |
            reports/coverage.xml
            reports/htmlcov/
          if-no-files-found: error
          retention-days: 1


  # ==========================================================
  # 3. STATIC APPLICATION SECURITY TESTING - BANDIT
  #
  # Primera ejecución:
  #   genera evidencia JSON.
  #
  # Segunda ejecución:
  #   actúa como Security Gate.
  # ==========================================================

  bandit:

    name: SA-01 | Bandit SAST

    runs-on: ubuntu-latest

    needs: ruff

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install Bandit
        run: |
          python -m pip install bandit

      - name: Create reports directory
        run: |
          mkdir -p reports

      # Genera el reporte JSON.
      # || true permite conservar la evidencia aunque existan hallazgos.
      - name: Generate Bandit JSON report
        run: |
          bandit \
            main.py \
            -f json \
            -o reports/bandit-report.json \
            || true

      - name: Verify Bandit report
        run: |
          test -f reports/bandit-report.json
          ls -lh reports/bandit-report.json

      # Publica un resumen de severidades en GitHub.
      - name: Publish Bandit summary
        if: always()
        run: |
          echo "## 🔐 SA-01 | Bandit SAST" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json

          with open(
              "reports/bandit-report.json",
              encoding="utf-8",
          ) as file:
              report = json.load(file)

          findings = report.get("results", [])

          high = sum(
              item.get("issue_severity") == "HIGH"
              for item in findings
          )

          medium = sum(
              item.get("issue_severity") == "MEDIUM"
              for item in findings
          )

          low = sum(
              item.get("issue_severity") == "LOW"
              for item in findings
          )

          print("| Severidad | Hallazgos |")
          print("|---|---:|")
          print(f"| 🔴 High | {high} |")
          print(f"| 🟠 Medium | {medium} |")
          print(f"| 🟡 Low | {low} |")
          print(f"| **Total** | **{len(findings)}** |")
          PY

      # Guarda temporalmente el JSON.
      - name: Upload Bandit intermediate artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-evidence
          path: reports/bandit-report.json
          if-no-files-found: error
          retention-days: 1

      # Security Gate.
      # -ll considera hallazgos Medium y High.
      - name: Enforce Bandit security gate
        run: |
          bandit main.py -ll


  # ==========================================================
  # 4. SOFTWARE COMPOSITION ANALYSIS - PIP-AUDIT
  #
  # Analiza vulnerabilidades conocidas en requirements.txt.
  # ==========================================================

  dependency-audit:

    name: SC-01 | Dependency Audit

    runs-on: ubuntu-latest

    needs: ruff

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install pip-audit
        run: |
          python -m pip install pip-audit

      - name: Create reports directory
        run: |
          mkdir -p reports

      # Genera evidencia JSON sin detener el job.
      - name: Generate dependency audit report
        run: |
          pip-audit \
            -r requirements.txt \
            -f json \
            -o reports/pip-audit-report.json \
            || true

      - name: Verify dependency audit report
        run: |
          test -f reports/pip-audit-report.json
          ls -lh reports/pip-audit-report.json

      # Publica métricas visibles directamente en GitHub.
      - name: Publish dependency audit summary
        if: always()
        run: |
          echo "## 📦 SC-01 | Dependency Audit" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json

          with open(
              "reports/pip-audit-report.json",
              encoding="utf-8",
          ) as file:
              report = json.load(file)

          dependencies = report.get("dependencies", [])

          vulnerable = [
              dep
              for dep in dependencies
              if dep.get("vulns")
          ]

          total_vulns = sum(
              len(dep.get("vulns", []))
              for dep in dependencies
          )

          print("| Métrica | Resultado |")
          print("|---|---:|")
          print(
              f"| Dependencias analizadas | "
              f"{len(dependencies)} |"
          )
          print(
              f"| Dependencias vulnerables | "
              f"{len(vulnerable)} |"
          )
          print(
              f"| Vulnerabilidades conocidas | "
              f"{total_vulns} |"
          )
          PY

      # Guarda temporalmente el JSON.
      - name: Upload dependency intermediate artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-evidence
          path: reports/pip-audit-report.json
          if-no-files-found: error
          retention-days: 1

      # Security Gate.
      - name: Enforce dependency security gate
        run: |
          pip-audit \
            -r requirements.txt


  # ==========================================================
  # 5. CONSOLIDACIÓN DE EVIDENCIAS
  #
  # Cada job se ejecuta en un runner independiente.
  # Por eso descargamos los artifacts intermedios y
  # construimos una única estructura final:
  #
  # reports/
  # ├── coverage/
  # ├── security/
  # └── dependencies/
  #
  # Finalmente se genera un único artifact:
  #
  # audit-reports
  # ==========================================================

  audit-evidence:

    name: AU-01 | Consolidate Audit Evidence

    runs-on: ubuntu-latest

    needs:
      - tests-coverage
      - bandit
      - dependency-audit

    # Permite consolidar evidencia aun cuando alguno de los
    # controles anteriores haya fallado.
    if: always()

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # Construye la estructura final.
      - name: Create consolidated reports structure
        run: |
          mkdir -p reports/coverage
          mkdir -p reports/security
          mkdir -p reports/dependencies

      # Descarga Coverage.
      - name: Download coverage evidence
        uses: actions/download-artifact@v4
        with:
          name: coverage-evidence
          path: reports/coverage

      # Descarga Bandit.
      - name: Download Bandit evidence
        uses: actions/download-artifact@v4
        with:
          name: bandit-evidence
          path: reports/security

      # Descarga pip-audit.
      - name: Download dependency evidence
        uses: actions/download-artifact@v4
        with:
          name: dependency-evidence
          path: reports/dependencies

      # Verifica todos los archivos consolidados.
      - name: Verify consolidated audit reports
        run: |
          echo "========================================"
          echo "AUDIT REPORTS"
          echo "========================================"

          find reports -type f | sort

      # Publica un resumen final visible en GitHub.
      - name: Publish final audit summary
        run: |
          echo "# 🛡️ Code Audit Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## Controles ejecutados" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| ID | Control | Herramienta |" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "|---|---|---|" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "| CQ-01 | Calidad de código | Ruff |" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "| TC-01 | Testing y cobertura | pytest / pytest-cov |" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "| SA-01 | Static Application Security Testing | Bandit |" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "| SC-01 | Software Composition Analysis | pip-audit |" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## Evidencias generadas" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "- 📊 Coverage XML y reporte HTML" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "- 🔐 Bandit JSON report" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "- 📦 pip-audit JSON report" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "📥 Los reportes completos están disponibles en el artifact **audit-reports**." \
            >> "$GITHUB_STEP_SUMMARY"

      # Genera UN único artifact final con todas las evidencias.
      - name: Upload consolidated audit reports
        uses: actions/upload-artifact@v4
        with:
          name: audit-reports
          path: reports/
          if-no-files-found: error
          retention-days: 30
